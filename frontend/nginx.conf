server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html references the current build's hashed JS/CSS filenames —
    # if the browser caches index.html itself, it keeps loading a stale
    # bundle after every deploy no matter how the assets below are cached.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Hashed filenames (Vite's build output) never change contents once
    # built, so these can be cached aggressively and safely.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy API calls to the backend service (path kept intact,
    # the backend serves under /api/v1).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Marketplace lifecycle: FlowPOS calls these against this app's public
    # domain (the Install/Uninstall/Webhook URLs registered in its listing),
    # which is this frontend/nginx container — forward to the backend.
    location ~ ^/(install|uninstall|webhooks)$ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
